name: Feedback / Bug report
description: Report a problem or suggest an improvement for Eat@State - Simplified
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      options:
        - label: Mobile
        - label: Desktop
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser / device
      description: e.g. iPhone 15, Safari 18 — or Windows 11, Chrome 126
      placeholder: e.g. iPhone · Safari
    validations:
      required: false
