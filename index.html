  <title id="title">Today's Dinner — Sparty unveiling dinner</title>
  <desc id="desc">Layered vector splash scene for a PWA. Elements are grouped by IDs for CSS animation.</desc>
  <defs>

      <stop offset="1" stop-color="#6fd7b0" stop-opacity="0"/>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">

    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">

      <stop offset="1" stop-color="#063b2f"/>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd49c"/>
      <stop offset="1" stop-color="#d99450"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">

    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">

    </filter>
    <filter id="steamBlur" x="-30%" y="-30%" width="160%" height="160%">

    <clipPath id="plateClip"><ellipse cx="540" cy="725" rx="235" ry="58"/></clipPath>

    <path d="M555 662 Q563 640 575 656 Q588 636 592 659" fill="none" stroke="#3c9559" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Layer 08: utensils -->
  <g id="layer-utensils" fill="url(#metal)" stroke="#76817c" stroke-width="5">
    <path id="fork" d="M300 805 L347 733 L361 741 L320 812 L340 818 L300 880 L279 868 Z"/>

    <text id="splash-meal-title" x="540" y="930" font-size="54" font-weight="700" letter-spacing="2">Today's Dinner</text>
